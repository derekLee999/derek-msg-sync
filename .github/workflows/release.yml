name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npx tauri build --bundles msi,nsis

      - name: Rename artifacts for release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object {
            $new = "derek-msg-sync_$version" + $_.Name.Substring($_.Name.IndexOf('_'))
            Rename-Item $_.FullName $new
            Write-Host "Renamed: $($_.Name) -> $new"
          }
          Get-ChildItem src-tauri/target/release/bundle/nsis/*Setup.exe | ForEach-Object {
            $new = "derek-msg-sync_$version" + $_.Name.Substring($_.Name.IndexOf('_'))
            Rename-Item $_.FullName $new
            Write-Host "Renamed: $($_.Name) -> $new"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: derek-msg-sync v${{ github.ref_name }}
          body: |
            ## 更新内容
            - 版本升级至 ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/derek-msg-sync_*.msi
            src-tauri/target/release/bundle/nsis/derek-msg-sync_*Setup.exe
